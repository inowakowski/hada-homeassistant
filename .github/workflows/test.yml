name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Tests against ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: the current Home Assistant
            python: "3.14"
            requirements: -r requirements_test.txt
          # The oldest Home Assistant hacs.json says the integration works with; that version of the test
          # package is the one made for Home Assistant 2024.8.0.
          - name: the oldest Home Assistant supported (2024.8.0)
            python: "3.12"
            requirements: pytest-homeassistant-custom-component==0.13.152
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.requirements }}
      - run: pytest
